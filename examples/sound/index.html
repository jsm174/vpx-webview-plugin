<!doctype html>
<script>
// A sound page with no picture: never placed on a screen, it plays synthesized sounds when the table
// sends "play". Its audio goes to VPX's mixer. The AudioContext is created at load and suspended, so the
// first sound does not stall (see the README).
const ac = new AudioContext()
ac.suspend()

function noise(seconds) {
  const buffer = ac.createBuffer(2, ac.sampleRate * seconds, ac.sampleRate)
  for (let c = 0; c < 2; c++) {
    const d = buffer.getChannelData(c)
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
  }
  return buffer
}

const sounds = {
  whoosh() {
    const t = ac.currentTime
    const src = ac.createBufferSource()
    src.buffer = noise(0.8)
    const filter = ac.createBiquadFilter()
    filter.type = 'bandpass'
    filter.Q.value = 2
    filter.frequency.setValueAtTime(2500, t)
    filter.frequency.exponentialRampToValueAtTime(250, t + 0.8)
    const gain = ac.createGain()
    gain.gain.setValueAtTime(0.0001, t)
    gain.gain.exponentialRampToValueAtTime(0.6, t + 0.05)
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8)
    src.connect(filter).connect(gain).connect(ac.destination)
    src.start(t)
  },
  blip() {
    const t = ac.currentTime
    const osc = ac.createOscillator()
    osc.type = 'square'
    osc.frequency.setValueAtTime(880, t)
    osc.frequency.exponentialRampToValueAtTime(1760, t + 0.08)
    const gain = ac.createGain()
    gain.gain.setValueAtTime(0.15, t)
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12)
    osc.connect(gain).connect(ac.destination)
    osc.start(t)
    osc.stop(t + 0.12)
  },
  chime() {
    const t = ac.currentTime
    for (const [i, f] of [523.25, 659.25, 783.99].entries()) {
      const osc = ac.createOscillator()
      osc.frequency.value = f
      const gain = ac.createGain()
      gain.gain.setValueAtTime(0.0001, t + i * 0.08)
      gain.gain.exponentialRampToValueAtTime(0.2, t + i * 0.08 + 0.01)
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 1.2)
      osc.connect(gain).connect(ac.destination)
      osc.start(t + i * 0.08)
      osc.stop(t + i * 0.08 + 1.2)
    }
  }
}

vpx.on('play', (name) => {
  if (!sounds[name]) return console.warn('unknown sound ' + name)
  ac.resume()
  sounds[name]()
})
</script>
