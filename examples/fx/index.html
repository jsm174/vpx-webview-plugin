<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A flasher effect: a slow breathing glow while idle, expanding rings and sparks on "burst",
// colour changes on "color". Driven from the table with WebView.Send.
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const rings = []
const sparks = []
let hue = 200
let targetHue = 200
let flash = 0

function resize() {
  canvas.width = innerWidth
  canvas.height = innerHeight
}
addEventListener('resize', resize)
resize()

function burst(strength = 1) {
  rings.push({ r: 0, life: 1, speed: 0.9 + 0.4 * strength })
  for (let i = 0; i < 60 * strength; i++) {
    const a = Math.random() * Math.PI * 2
    const v = 0.2 + Math.random() * 0.8
    sparks.push({ x: 0, y: 0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 })
  }
  flash = Math.min(1, flash + 0.6 * strength)
}

vpx.on('burst', (data) => burst(Number(data) || 1))
vpx.on('color', (data) => { targetHue = Number(data) })

let last = performance.now()
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05)
  last = now
  const w = canvas.width
  const h = canvas.height
  const cx = w / 2
  const cy = h / 2
  const scale = Math.min(w, h) / 2

  hue += ((targetHue - hue + 540) % 360 - 180) * Math.min(1, dt * 4)
  flash *= Math.exp(-dt * 6)

  ctx.globalCompositeOperation = 'source-over'
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'
  ctx.fillRect(0, 0, w, h)
  ctx.globalCompositeOperation = 'lighter'

  const breathe = 0.35 + 0.15 * Math.sin(now / 700) + flash
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 1.4)
  glow.addColorStop(0, `hsla(${hue}, 90%, 60%, ${breathe})`)
  glow.addColorStop(1, `hsla(${hue}, 90%, 40%, 0)`)
  ctx.fillStyle = glow
  ctx.fillRect(0, 0, w, h)

  for (let i = rings.length - 1; i >= 0; i--) {
    const ring = rings[i]
    ring.r += dt * ring.speed
    ring.life -= dt * 0.9
    if (ring.life <= 0) { rings.splice(i, 1); continue }
    ctx.strokeStyle = `hsla(${hue + 30}, 100%, 70%, ${ring.life})`
    ctx.lineWidth = 2 + 10 * ring.life
    ctx.beginPath()
    ctx.ellipse(cx, cy, ring.r * scale * (w / h), ring.r * scale, 0, 0, Math.PI * 2)
    ctx.stroke()
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]
    s.x += s.vx * dt
    s.y += s.vy * dt
    s.life -= dt * 1.2
    if (s.life <= 0) { sparks.splice(i, 1); continue }
    ctx.fillStyle = `hsla(${hue - 20}, 100%, 75%, ${s.life})`
    ctx.fillRect(cx + s.x * scale * (w / h), cy + s.y * scale, 3, 3)
  }

  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
